version: "3.9"

services:
  yield-forge:
    build: .
    container_name: mimo-yield-forge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - forge-net
    healthcheck:
      test: ["CMD", "python", "-c", "import src.forge; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - forge-net

volumes:
  redis-data:

networks:
  forge-net:
    driver: bridge
